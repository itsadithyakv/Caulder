<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'"
    />
    <link rel="icon" type="image/png" href="./assets/logo-light.png" />
    <title>Caulder</title>
    <!-- Applied before the first paint so the window never flashes the wrong
         theme. A separate file rather than an inline script on purpose: the
         CSP above is script-src 'self', which refuses inline script silently.
         See src/theme-boot.ts. -->
    <script type="module" src="./theme-boot.ts"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
